<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Bebida</title>

</head>
<body>
    <h1>Registrar Nueva Bebida</h1>
    <form action ="/bebidas/crear" method="POST">
        <label for="nombre">Nombre de la bebida:</label><br>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="precio">Precio:</label><br>
        <input type="number" step="0.01" id="precio" name="precio" required><br><br>

        <button type="submit">Guardar Bebida</button>
    </form>
    <br>
    <a href="/bebidas">Cancelar y volver a la lista</a>
</body>
</html>
