<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Pizzas Coliseo</h1>

    <a href="/bebidas/crear">Agregar nueva bebida</a>

    <table>
        <tbody>
            <tr th:each="bebida : ${bebidas}">
                <td th:text="${bebida.nombre}"></td>
                <td th:text="${bebida.descripcion}"></td>
                <td>
                    <a th:href="@{/bebidas/crear}">Agregar nueva bebida</a>
                    <a th:href="@{/editar/${bebida.id}}">Editar</a>
                    <a th:href="@{/eliminar/${bebida.id}}">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
