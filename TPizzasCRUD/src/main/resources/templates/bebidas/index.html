<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Bebidas</title>
</head>
<body>
<h1>Catálogo de Bebidas</h1>
<a href="/bebidas/crear"><button>Agregar Nueva Bebida</button></a>
<br><br>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="bebida : ${bebidas}">
        <td th:text="${bebida.id}"></td>
        <td th:text="${bebida.nombre}"></td>
        <td th:text="${bebida.precio}"></td>
        <td>
            <a th:href="@{/bebidas/editar/{id}(id=${bebida.id})}">Editar</a>
            <form th:action="@{/bebidas/borrar/{id}(id=${bebida.id})}" method="POST" style="display:inline;">
                <button type="submit">Borrar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<br>
<a href="/pizzas">Volver al menú de Pizzas</a>
</body>
</html>
