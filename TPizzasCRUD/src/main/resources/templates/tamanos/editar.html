<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Tamaño</title>
</head>
<body>
<h1>Editar Tamaño</h1>
<form th:action="@{/tamanos/actualizar/{id}(id=${tamano.id})}" method="POST">
    <label>Nombre:</label><br>
    <input type="text" name="nombre" th:value="${tamano.nombre}" required><br><br>
    <button type="submit">Actualizar Tamaño</button>
</form>
<br>
<a href="/tamanos">Cancelar</a>
</body>
</html>
