<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Pizza</title>
</head>
<body>
<h1>Editar Pizza</h1>
<form th:action="@{/pizzas/actualizar/{id}(id=${pizza.id})}" method="POST">
    <label>Nombre:</label><br>
    <input type="text" name="nombre" th:value="${pizza.nombre}" required><br><br>
    <label>Descripción:</label><br>
    <input type="text" name="descripcion" th:value="${pizza.descripcion}" required><br><br>
    <label>Precio:</label><br>
    <input type="number" step="0.01" name="precio" th:value="${pizza.precio}" required><br><br>
    <button type="submit">Actualizar Pizza</button>
</form>
<br>
<a href="/pizzas">Cancelar</a>
</body>
</html>
